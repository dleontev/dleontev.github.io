<nav class="site-nav" aria-label="Main navigation">
  <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.author.name | escape }}</a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" hidden>Menu</button>
  <div id="site-menu" class="site-menu">
    {% for item in site.data.navigation %}
    <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
    {% endfor %}
    <button id="theme-toggle" type="button" aria-pressed="false" hidden>Dark mode</button>
  </div>
</nav>
