<div class="post-search" data-search-url="{{ '/search.json' | relative_url }}">
  <label for="search-input">Search articles</label>
  <div class="search-controls">
    <input id="search-input" type="search" placeholder="Search titles and topics" aria-controls="search-results" autocomplete="off" disabled>
    <button id="clear-search" type="button" hidden>Clear search</button>
    <a class="btn btn-outline-primary" href="{{ '/blog/tags' | relative_url }}">Browse tags</a>
  </div>
  <p id="search-status" class="search-status" role="status"></p>
  <button id="retry-search" type="button" hidden>Retry search</button>
  <section id="search-results" aria-labelledby="results-heading" hidden>
    <h2 id="results-heading">Search results</h2>
    <ul id="results-container" class="search-results"></ul>
  </section>
  <noscript><p>Search requires JavaScript. All articles are listed below, or you can browse by tag.</p></noscript>
</div>
