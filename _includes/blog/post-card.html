<article class="article-card">
  <h2><a href="{% if post.external_url %}{{ post.external_url }}{% else %}{{ post.url | relative_url }}{% endif %}">{{ post.title | escape }}</a></h2>
  <p>{{ post.description | escape }}</p>
  <ul class="topic-list" aria-label="Topics">{% for tag in post.tags %}<li>{{ tag | escape }}</li>{% endfor %}</ul>
  <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%-d %B %Y' }}</time>
</article>
