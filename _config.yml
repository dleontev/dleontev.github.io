title: "Dimitriy Leontev | Network and Systems Administrator"
description: "Microsoft 365, identity, infrastructure, and cloud projects and articles by Dimitriy Leontev, Network and Systems Administrator."
url: "https://dleontev.com"
baseurl: ""
repository: dleontev/dleontev.github.io
social_image: /assets/profile-social.png
open_new_tab: false
plugins:
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jemoji
  - jekyll-feed
author:
  name: Dimitriy Leontev
  job_title: Network and Systems Administrator
  image: /assets/profile-social.png
  email: info@dleontev.com
  github: dleontev
  linkedin: dleontev
permalink: /blog/:title
collections:
  projects:
    output: true
    permalink: /projects/:name
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
exclude:
  - README.md
  - assets/lib/README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.cjs
  - tests
  - scripts
  - docs
  - test-results
  - playwright-report
  - work-image-stats.json
  - "*.log"

  - .validation
  - visual-baselines
  - assets/fonts/README.md
