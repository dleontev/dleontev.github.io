title: "Dimitriy Leontev | Systems and Network Administrator"
description: "Infrastructure projects and technical guides by Dimitriy Leontev, covering systems and network administration, Azure deployments, and PowerShell automation."
url: "https://dleontev.com"
baseurl: ""
repository: dleontev/dleontev.github.io
social_image: /assets/profile-social.png
open_new_tab: false

# Rendering defaults previously supplied by the github-pages gem.
theme: null
markdown: kramdown
highlighter: rouge
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: false
future: true
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: [paragraph_end]
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jekyll-github-metadata
  - jemoji
  - jekyll-feed
author:
  name: Dimitriy Leontev
  job_title: Network Administrator
  image: /assets/profile-social.png
  email: info@dleontev.com
  github: dleontev
  linkedin: dleontev
permalink: /blog/:title
collections:
  projects:
    output: true
    permalink: /projects/:name
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
exclude:
  - README.md
  - assets/lib/README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.cjs
  - tests
  - scripts
  - docs
  - test-results
  - playwright-report
  - work-image-stats.json
  - "*.log"

  - .validation
  - visual-baselines
  - assets/fonts/README.md
