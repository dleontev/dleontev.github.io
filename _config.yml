title: "Dimitriy Leontev | Microsoft 365, Systems & Cloud"
description: "Practical Microsoft 365, identity, systems, and cloud operations projects and articles by Dimitriy Leontev."
url: "https://dleontev.com"
baseurl: ""
repository: dleontev/dleontev.github.io
remote_theme: yousinix/portfolYOU@7a3e795d385e2dcd5bcd284f4862e1314efd1336
social_image: /assets/profile-social.png
open_new_tab: false
plugins:
  - jekyll-remote-theme
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jemoji
author:
  name: Dimitriy Leontev
  image: /assets/profile-social.png
  email: info@dleontev.com
  github: dleontev
  linkedin: dleontev
permalink: /blog/:title
collections:
  projects:
    output: true
    permalink: /projects/:name
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
exclude:
  - README.md
  - assets/lib/README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.cjs
  - tests
  - scripts
  - docs
  - test-results
  - playwright-report
  - work-image-stats.json
  - "*.log"
